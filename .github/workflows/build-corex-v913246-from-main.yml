name: Build Corex v9.13.246 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corex-v9.13.246
    steps:
      - name: Check out verified Corex source
        uses: actions/checkout@v4
        with:
          ref: corex-v9.13.246

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore consolidated HTML asset
        run: |
          mkdir -p app/src/main/assets
          cat app/src/main/assets_parts/index.html.gz.b64.part-* | base64 --decode | gzip --decompress > app/src/main/assets/index.html

      - name: Build installable APK without emulator
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename and verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Corex-v9.13.246.apk
          test -s Corex-v9.13.246.apk

      - name: Upload Corex APK
        uses: actions/upload-artifact@v4
        with:
          name: Corex-v9.13.246-APK
          path: corex-v9.13.246/Corex-v9.13.246.apk
          if-no-files-found: error
          retention-days: 30
