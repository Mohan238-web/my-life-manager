name: Build Corex v9.13.260 and PC Companion 1.1.2

on:
  push:
    branches: [ corex-pc-v9.13.260 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corex-v9.13.249
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore and verify the approved Corex HTML
        run: |
          mkdir -p app/src/main/assets
          cat app/src/main/assets_parts/index.html.gz.b64.part-* | base64 --decode | gzip --decompress > app/src/main/assets/index.html
          grep -q "const VERSION='9.13.260'" app/src/main/assets/index.html
          grep -q 'corex-approved-settings-v913260-style' app/src/main/assets/index.html
          grep -q 'corex-pc-snapshot-applied' app/src/main/assets/index.html
          grep -q 'id="pcScanQr"' app/src/main/assets/index.html
          grep -q 'data-pc-transport="USB tethering"' app/src/main/assets/index.html
          ! grep -q 'PC changes applied. Reopening Corex' app/src/main/assets/index.html
      - name: Run Corex, reminder, icon and connection regressions
        working-directory: .
        run: node tests/verify-v913251.mjs
      - name: Prepare selected premium launcher resource
        run: |
          base64 --decode app/src/main/res/drawable-nodpi/corex_icon_v260_art.webp.b64 > app/src/main/res/drawable-nodpi/corex_icon_v260_art.webp
          rm app/src/main/res/drawable-nodpi/corex_icon_v260_art.webp.b64
      - name: Compile Android app without emulator
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK identity and packaged components
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Corex-v9.13.260-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Corex-v9.13.260-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Corex-v9.13.260-unsigned.apk | grep "package: name='com.mohan.mylifemanager' versionCode='913260' versionName='9.13.260-corex-pc'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions Corex-v9.13.260-unsigned.apk | grep 'android.permission.CAMERA'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions Corex-v9.13.260-unsigned.apk | grep 'android.permission.INTERNET'
          unzip -l Corex-v9.13.260-unsigned.apk | grep 'assets/index.html'
          unzip -l Corex-v9.13.260-unsigned.apk | grep 'corex_icon_v260_art'
          unzip -l Corex-v9.13.260-unsigned.apk | grep 'corex_icon_v249_art_webp'
      - uses: actions/upload-artifact@v4
        with:
          name: Corex-v9.13.260-unsigned-APK
          path: corex-v9.13.249/Corex-v9.13.260-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare Android signing verifier
        run: |
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)
          test -f "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" Corex-apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Corex-apksigner-tool-v913260
          path: corex-v9.13.249/Corex-apksigner.jar
          if-no-files-found: error
          retention-days: 1

  windows-companion:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: pc-companion/go.mod
      - name: Reconstruct the verified Corex interface for Windows
        shell: bash
        run: |
          cat ../corex-v9.13.249/app/src/main/assets_parts/index.html.gz.b64.part-* | base64 --decode > corex.html.gz
          gzip --test corex.html.gz
          gzip --decompress --stdout corex.html.gz | grep -q "const VERSION='9.13.260'"
      - name: Test synchronization, pairing and recovery
        run: go test -v ./...
      - name: Build standalone Windows EXE
        shell: cmd
        run: build-windows.bat
      - name: Verify Windows executable
        shell: pwsh
        run: |
          $file = Get-Item Corex-PC-Companion-v1.1.2.exe
          if ($file.Length -lt 1000000 -or $file.Length -gt 30000000) { throw "Unexpected EXE size: $($file.Length)" }
          $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Not a Windows PE executable" }
          Get-FileHash $file.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Corex-PC-Companion-v1.1.2-Windows
          path: pc-companion/Corex-PC-Companion-v1.1.2.exe
          if-no-files-found: error
          retention-days: 30
