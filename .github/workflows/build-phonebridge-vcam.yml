name: Build PhoneBridge Virtual Camera

on:
  push:
    branches: [phonebridge-build]
    paths:
      - '.github/workflows/build-phonebridge-vcam.yml'
      - 'phonebridge-vcam/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vcam:
    name: Windows PhoneBridge Camera
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone Microsoft camera sample
        shell: pwsh
        run: git clone --depth 1 https://github.com/microsoft/Windows-Camera.git windows-camera
      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore windows-camera/Samples/VirtualCamera/VirtualCameraSample.sln -PackagesDirectory windows-camera/Samples/VirtualCamera/packages -NonInteractive
      - name: Patch frame source, color conversion and PhoneBridge COM CLSID
        shell: pwsh
        run: |
          python phonebridge-vcam/patch_vcam.py windows-camera/Samples/VirtualCamera/VirtualCameraMediaSource/SimpleFrameGenerator.cpp
          $src = 'windows-camera/Samples/VirtualCamera/VirtualCameraMediaSource/SimpleFrameGenerator.cpp'
          if (-not (Select-String -Path $src -Pattern 'PhoneBridgeColorSafeNV12' -Quiet)) { throw 'Color-safe NV12 converter patch missing' }
          if (-not (Select-String -Path $src -Pattern 'dst\[0\] = src\[0\]' -Quiet)) { throw 'Explicit BGRA bus copy patch missing' }
          python phonebridge-vcam/test_color_math.py
      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build PhoneBridge virtual camera media source
        shell: pwsh
        run: |
          & "$env:MSBUILD" windows-camera/Samples/VirtualCamera/VirtualCameraMediaSource/VirtualCameraMediaSource.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$PWD\windows-camera\Samples\VirtualCamera\" /verbosity:minimal
      - name: Build PhoneBridge virtual camera setup and COM probe
        shell: pwsh
        run: |
          cmake -S phonebridge-vcam -B phonebridge-vcam/build -A x64
          cmake --build phonebridge-vcam/build --config Release
      - name: Verify PhoneBridge COM class factory
        shell: pwsh
        run: |
          $dll = Get-ChildItem windows-camera -Recurse -Filter VirtualCameraMediaSource.dll | Select-Object -First 1
          if (-not $dll) { throw 'VirtualCameraMediaSource.dll not produced' }
          & phonebridge-vcam/build/Release/PhoneBridgeComProbe.exe $dll.FullName
          if ($LASTEXITCODE -ne 0) { throw "PhoneBridge COM class-factory probe failed with exit code $LASTEXITCODE" }
      - name: Package PhoneBridge Camera
        shell: pwsh
        run: |
          $dll = Get-ChildItem windows-camera -Recurse -Filter VirtualCameraMediaSource.dll | Select-Object -First 1
          if (-not $dll) { throw 'VirtualCameraMediaSource.dll not produced' }
          New-Item -ItemType Directory -Force phonebridge-vcam-out | Out-Null
          Copy-Item $dll.FullName phonebridge-vcam-out/VirtualCameraMediaSource.dll
          Copy-Item phonebridge-vcam/build/Release/PhoneBridgeVirtualCameraSetup.exe phonebridge-vcam-out/PhoneBridgeVirtualCameraSetup.exe
          @'
          PhoneBridge Camera - Windows 11 build 22000+

          COLOR FIX BUILD
          1. Uninstall the previous PhoneBridge Camera by running PhoneBridgeVirtualCameraSetup.exe /uninstall from the OLD package if available.
          2. Keep the two NEW files together.
          3. Run the NEW PhoneBridgeVirtualCameraSetup.exe as administrator.
          4. Keep PhoneBridge-Control.exe running and the phone connected.
          5. Restart Zoom, Meet, Teams, OBS, Windows Camera or the browser.
          6. Select "PhoneBridge Camera" as the camera.

          This build uses an explicit BGRA -> BT.601 NV12 conversion with 2x2 chroma averaging.
          This test build is not commercially code-signed.
          '@ | Set-Content phonebridge-vcam-out/README.txt
          Get-FileHash phonebridge-vcam-out/VirtualCameraMediaSource.dll -Algorithm SHA256
          Get-FileHash phonebridge-vcam-out/PhoneBridgeVirtualCameraSetup.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Windows-Virtual-Camera
          path: phonebridge-vcam-out/*
          if-no-files-found: error
