name: My Life Manager v9.13.198 device verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - api: 23
            screens: "320x568:280 360x640:320"
          - api: 35
            screens: "393x873:420 412x915:420 600x960:320"
    steps:
      - uses: actions/checkout@v4
      - name: Expand final source
        run: mkdir project && unzip -q My-Life-Manager-Android-v9.13.198-SOURCE.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            for specification in ${{ matrix.screens }}; do
              screen="${specification%%:*}"
              density="${specification##*:}"
              adb shell wm size "$screen"
              adb shell wm density "$density"
              gradle -p project connectedDebugAndroidTest --stacktrace
            done
