name: Build PhoneBridge v1 Package

on:
  push:
    branches: [phonebridge-build]
    paths:
      - '.github/workflows/build-phonebridge-v1-package.yml'
      - 'phonebridge-installer/**'
      - 'phonebridge-vcam/**'
      - 'phonebridge-v1/**'
      - 'phonebridge-patches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: PhoneBridge v1 Complete Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild base source and v1 patch archive
        shell: pwsh
        run: |
          $names = 'p1-0','p1-1','p1-2','p1-3','part2','p3-0','p3-1','p3-2','p3-3','part4'
          $b64 = ($names | ForEach-Object { Get-Content "phonebridge-source/$_.b64" -Raw }) -join ''
          [IO.File]::WriteAllBytes('PhoneBridge-source.rebuilt.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path PhoneBridge-source.rebuilt.zip -DestinationPath . -Force
          $v1Names = 'v1patch-00','v1patch-01','v1patch-02'
          $v1b64 = ($v1Names | ForEach-Object { Get-Content "phonebridge-v1/$_.b64" -Raw }) -join ''
          [IO.File]::WriteAllBytes('PhoneBridge-v1-patches.zip', [Convert]::FromBase64String($v1b64))
          Expand-Archive -Path PhoneBridge-v1-patches.zip -DestinationPath PhoneBridge-v1-patches -Force

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        shell: pwsh
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build matched Android v1 APK
        shell: pwsh
        run: |
          Copy-Item phonebridge-patches/StreamService.java PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java -Force
          Copy-Item phonebridge-patches/YuvTools.java PhoneBridge/android/app/src/main/java/com/phonebridge/app/YuvTools.java -Force
          python phonebridge-patches/fix_camera_main_thread.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          python phonebridge-patches/fix_av_quality.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          python phonebridge-patches/fix_color_rotation_v2.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          python phonebridge-patches/fix_color_depth_resolution_v3.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          python phonebridge-patches/fix_standard_nv21_v4.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          Copy-Item PhoneBridge-v1-patches/MainActivityV1.java PhoneBridge/android/app/src/main/java/com/phonebridge/app/MainActivity.java -Force
          python PhoneBridge-v1-patches/upgrade_v1_android.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          (Get-Content PhoneBridge/android/app/build.gradle.kts -Raw).Replace('compileSdk = 37','compileSdk = 36').Replace('targetSdk = 37','targetSdk = 36') | Set-Content PhoneBridge/android/app/build.gradle.kts
          Select-String -Path PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java -Pattern 'OUTPUT_IMAGE_FORMAT_NV21' -Quiet | ForEach-Object { if (-not $_) { throw 'NV21 regression' } }
          Select-String -Path PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java -Pattern 'OrientationEventListener' -Quiet | ForEach-Object { if (-not $_) { throw 'Rotation regression' } }
          Select-String -Path PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java -Pattern 'NoiseSuppressor.isAvailable' -Quiet | ForEach-Object { if (-not $_) { throw 'Audio suppression regression' } }
          gradle -p PhoneBridge/android --stacktrace assembleDebug

      - name: Build static libjpeg-turbo 3.2.0
        shell: pwsh
        run: |
          git clone --branch 3.2.0 --depth 1 https://github.com/libjpeg-turbo/libjpeg-turbo.git libjpeg-turbo
          $prefix = Join-Path $PWD 'libjpeg-install'
          cmake -S libjpeg-turbo -B libjpeg-build -A x64 -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_TURBOJPEG=ON -DWITH_TOOLS=OFF -DWITH_TESTS=OFF -DWITH_SIMD=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_INSTALL_PREFIX=$prefix"
          cmake --build libjpeg-build --config Release --target install

      - name: Build known-good Direct2D v1 receiver
        shell: pwsh
        run: |
          Copy-Item phonebridge-patches/Receiver.cpp PhoneBridge/windows/native/Receiver.cpp -Force
          Copy-Item phonebridge-patches/JpegDecoder.cpp PhoneBridge/windows/native/JpegDecoder.cpp -Force
          Copy-Item phonebridge-patches/JpegDecoder.h PhoneBridge/windows/native/JpegDecoder.h -Force
          Copy-Item phonebridge-patches/DecoderSelfTest.cpp PhoneBridge/windows/native/DecoderSelfTest.cpp -Force
          Copy-Item phonebridge-patches/CMakeLists.txt PhoneBridge/windows/native/CMakeLists.txt -Force
          Copy-Item phonebridge-patches/SharedBus.cpp PhoneBridge/windows/native/SharedBus.cpp -Force
          Copy-Item phonebridge-patches/SharedBus.h PhoneBridge/windows/native/SharedBus.h -Force
          python phonebridge-patches/add_raw_jpeg_diagnostic.py PhoneBridge/windows/native/Receiver.cpp
          python phonebridge-patches/fix_preview_direct2d.py PhoneBridge/windows/native/Receiver.cpp
          python PhoneBridge-v1-patches/upgrade_v1_windows.py PhoneBridge/windows/native/Receiver.cpp
          $cmake = Get-Content PhoneBridge/windows/native/CMakeLists.txt -Raw
          $cmake = $cmake.Replace(
            'target_link_libraries(PhoneBridgeReceiver PRIVATE ws2_32 ole32 shlwapi comctl32 libjpeg-turbo::turbojpeg-static)',
            'target_link_libraries(PhoneBridgeReceiver PRIVATE ws2_32 ole32 shlwapi comctl32 shell32 advapi32 mfplat mfreadwrite mfuuid libjpeg-turbo::turbojpeg-static)'
          )
          Set-Content PhoneBridge/windows/native/CMakeLists.txt $cmake
          $prefix = Join-Path $PWD 'libjpeg-install'
          cmake -S PhoneBridge/windows/native -B PhoneBridge/windows/build -A x64 "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build PhoneBridge/windows/build --config Release
          PhoneBridge/windows/build/Release/PhoneBridgeDecoderSelfTest.exe
          if (Select-String -Path PhoneBridge/windows/native/Receiver.cpp -Pattern 'StretchDIBits\(' -Quiet) { throw 'Legacy renderer regression' }

      - name: Build PhoneBridge virtual camera
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/Windows-Camera.git windows-camera
          nuget restore windows-camera/Samples/VirtualCamera/VirtualCameraSample.sln -PackagesDirectory windows-camera/Samples/VirtualCamera/packages -NonInteractive
          python phonebridge-vcam/patch_vcam.py windows-camera/Samples/VirtualCamera/VirtualCameraMediaSource/SimpleFrameGenerator.cpp
          python phonebridge-vcam/test_color_math.py
          python phonebridge-installer/patch_vcam_silent.py phonebridge-vcam/PhoneBridgeVirtualCameraSetup.cpp
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & "$msbuild" windows-camera/Samples/VirtualCamera/VirtualCameraMediaSource/VirtualCameraMediaSource.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$PWD\windows-camera\Samples\VirtualCamera\" /verbosity:minimal
          cmake -S phonebridge-vcam -B phonebridge-vcam/build -A x64
          cmake --build phonebridge-vcam/build --config Release
          $dll = Get-ChildItem windows-camera -Recurse -Filter VirtualCameraMediaSource.dll | Select-Object -First 1
          if (-not $dll) { throw 'Virtual camera DLL not produced' }
          & phonebridge-vcam/build/Release/PhoneBridgeComProbe.exe $dll.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Virtual camera COM verification failed' }
          "VCAM_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force phonebridge-installer/payload | Out-Null
          Copy-Item PhoneBridge/windows/build/Release/PhoneBridgeReceiver.exe phonebridge-installer/payload/PhoneBridge.exe
          Copy-Item phonebridge-vcam/build/Release/PhoneBridgeVirtualCameraSetup.exe phonebridge-installer/payload/PhoneBridgeVirtualCameraSetup.exe
          Copy-Item "$env:VCAM_DLL" phonebridge-installer/payload/VirtualCameraMediaSource.dll
          Copy-Item PhoneBridge/android/app/build/outputs/apk/debug/app-debug.apk phonebridge-installer/payload/PhoneBridge-v1.apk
          @'
          PhoneBridge v1.0 beta

          Proven camera pipeline preserved:
          Android CameraX standardized NV21 -> JPEG -> Windows libjpeg-turbo BGRA -> Direct2D preview -> PhoneBridge virtual camera.

          Windows installer includes:
          - PhoneBridge desktop receiver
          - PhoneBridge Camera registration
          - Private-network firewall rule
          - Optional Start with Windows
          - Matching Android APK in the Android subfolder

          The Android APK is a development/debug-signed build and the Windows package is not commercially code-signed yet.
          '@ | Set-Content phonebridge-installer/payload/README.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build one-file Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc phonebridge-installer/PhoneBridge.iss
          if ($LASTEXITCODE -ne 0) { throw 'PhoneBridge installer build failed' }
          Get-FileHash phonebridge-installer/out/PhoneBridge-v1.0-Setup.exe -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-v1-Complete-Package
          path: |
            phonebridge-installer/out/PhoneBridge-v1.0-Setup.exe
            phonebridge-installer/payload/PhoneBridge-v1.apk
            phonebridge-installer/payload/README.txt
          if-no-files-found: error
