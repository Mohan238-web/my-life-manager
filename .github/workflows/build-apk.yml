name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - apk-v9.13.161-toolbar-fix

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reassemble v9.13.161 offline workspace
        run: |
          mkdir -p app/src/main/assets
          : > /tmp/index.html.gz
          for f in app/src/main/assets_parts/index.v913161.gz.b64.part-*; do
            base64 -d "$f" >> /tmp/index.html.gz
          done
          gzip -dc /tmp/index.html.gz > app/src/main/assets/index.html
          echo "c58ff68ed0b0299733a603d478d0a43fec2e4f36133fb5a961d15f2c6315283c  app/src/main/assets/index.html" | sha256sum -c -
      - name: Build debug APK without emulator
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: My-Life-Manager-v9.13.161-APK
          path: app/build/outputs/apk/debug/app-debug.apk
