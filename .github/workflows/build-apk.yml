name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reassemble v9.13.98 offline workspace
        run: |
          mkdir -p app/src/main/assets
          : > /tmp/index.html.gz
          for f in app/src/main/assets_parts/index.v91398.gz.b64.part-*; do
            base64 -d "$f" >> /tmp/index.html.gz
          done
          gzip -dc /tmp/index.html.gz > app/src/main/assets/index.html
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: My-Life-Manager-v9.13.98-APK
          path: app/build/outputs/apk/debug/app-debug.apk
