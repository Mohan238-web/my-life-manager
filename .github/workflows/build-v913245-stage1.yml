name: Build My Life Manager v9.13.245 Stage 1 APK

on:
  push:
    branches: [ stage1-v9.13.245 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-v9.13.245-stage1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore consolidated HTML asset
        run: |
          mkdir -p app/src/main/assets
          cat app/src/main/assets_parts/index.html.gz.b64.part-* | base64 --decode | gzip --decompress > app/src/main/assets/index.html

      - name: Build installable APK (no emulator)
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename and verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk My-Life-Manager-v9.13.245-Stage1.apk
          test -s My-Life-Manager-v9.13.245-Stage1.apk

      - name: Upload Stage 1 APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Life-Manager-v9.13.245-Stage1-APK
          path: android-v9.13.245-stage1/My-Life-Manager-v9.13.245-Stage1.apk
          if-no-files-found: error
          retention-days: 30
