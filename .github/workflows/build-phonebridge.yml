name: Build PhoneBridge

on:
  push:
    branches: [phonebridge-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild PhoneBridge source archive
        run: |
          cat phonebridge-source/p1-0.b64 phonebridge-source/p1-1.b64 phonebridge-source/p1-2.b64 phonebridge-source/p1-3.b64 phonebridge-source/part2.b64 phonebridge-source/p3-0.b64 phonebridge-source/p3-1.b64 phonebridge-source/p3-2.b64 phonebridge-source/p3-3.b64 phonebridge-source/part4.b64 | base64 -d > PhoneBridge-source.rebuilt.zip
          unzip -t PhoneBridge-source.rebuilt.zip
          unzip -q PhoneBridge-source.rebuilt.zip
      - name: Apply camera lifecycle and A/V quality patches
        run: |
          cp phonebridge-patches/StreamService.java PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          cp phonebridge-patches/YuvTools.java PhoneBridge/android/app/src/main/java/com/phonebridge/app/YuvTools.java
          python phonebridge-patches/fix_camera_main_thread.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          python phonebridge-patches/fix_av_quality.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          python phonebridge-patches/fix_color_rotation_v2.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          python phonebridge-patches/fix_color_depth_resolution_v3.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          python phonebridge-patches/fix_standard_nv21_v4.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'ContextCompat.getMainExecutor(this)' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'OUTPUT_IMAGE_FORMAT_NV21' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'fromCameraXStandardNv21' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'fromCameraXStandardNv21' PhoneBridge/android/app/src/main/java/com/phonebridge/app/YuvTools.java
          grep -q 'ResolutionSelector' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'FALLBACK_RULE_CLOSEST_LOWER_THEN_HIGHER' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'OrientationEventListener' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'UseCase.snapToSurfaceRotation' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'NoiseSuppressor.isAvailable()' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          if grep -q '\.setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java; then
            echo 'Active CameraX RGBA output path still present' >&2
            exit 1
          fi
          if grep -q 'Bitmap source = rgbaPlaneToArgb8888(image)' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java; then
            echo 'Active ARGB frame conversion still present' >&2
            exit 1
          fi
          if grep -q 'future.addListener.*cameraExecutor' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java; then
            echo 'CameraX lifecycle is still using background executor' >&2
            exit 1
          fi
      - name: Pin stable Android API
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' PhoneBridge/android/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' PhoneBridge/android/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build APK
        run: gradle -p PhoneBridge/android --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Android-NV21-APK
          path: PhoneBridge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows Direct2D TurboJPEG Receiver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild PhoneBridge source archive
        shell: pwsh
        run: |
          $names = 'p1-0','p1-1','p1-2','p1-3','part2','p3-0','p3-1','p3-2','p3-3','part4'
          $b64 = ($names | ForEach-Object { Get-Content "phonebridge-source/$_.b64" -Raw }) -join ''
          [IO.File]::WriteAllBytes('PhoneBridge-source.rebuilt.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path PhoneBridge-source.rebuilt.zip -DestinationPath . -Force
      - name: Build static libjpeg-turbo 3.2.0
        shell: pwsh
        run: |
          git clone --branch 3.2.0 --depth 1 https://github.com/libjpeg-turbo/libjpeg-turbo.git libjpeg-turbo
          $prefix = Join-Path $PWD 'libjpeg-install'
          cmake -S libjpeg-turbo -B libjpeg-build -A x64 -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_TURBOJPEG=ON -DWITH_TOOLS=OFF -DWITH_TESTS=OFF -DWITH_SIMD=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_INSTALL_PREFIX=$prefix"
          cmake --build libjpeg-build --config Release --target install
      - name: Apply TurboJPEG Direct2D receiver patches
        shell: pwsh
        run: |
          Copy-Item phonebridge-patches/Receiver.cpp PhoneBridge/windows/native/Receiver.cpp -Force
          Copy-Item phonebridge-patches/JpegDecoder.cpp PhoneBridge/windows/native/JpegDecoder.cpp -Force
          Copy-Item phonebridge-patches/JpegDecoder.h PhoneBridge/windows/native/JpegDecoder.h -Force
          Copy-Item phonebridge-patches/DecoderSelfTest.cpp PhoneBridge/windows/native/DecoderSelfTest.cpp -Force
          Copy-Item phonebridge-patches/CMakeLists.txt PhoneBridge/windows/native/CMakeLists.txt -Force
          Copy-Item phonebridge-patches/SharedBus.cpp PhoneBridge/windows/native/SharedBus.cpp -Force
          Copy-Item phonebridge-patches/SharedBus.h PhoneBridge/windows/native/SharedBus.h -Force
          python phonebridge-patches/add_raw_jpeg_diagnostic.py PhoneBridge/windows/native/Receiver.cpp
          python phonebridge-patches/fix_preview_direct2d.py PhoneBridge/windows/native/Receiver.cpp
          Select-String -Path PhoneBridge/windows/native/JpegDecoder.cpp -Pattern 'tjDecompress2' -Quiet | ForEach-Object { if (-not $_) { throw 'TurboJPEG decoder missing' } }
          Select-String -Path PhoneBridge/windows/native/JpegDecoder.cpp -Pattern 'TJPF_BGRA' -Quiet | ForEach-Object { if (-not $_) { throw 'Explicit BGRA output missing' } }
          Select-String -Path PhoneBridge/windows/native/Receiver.cpp -Pattern 'D2D1CreateFactory' -Quiet | ForEach-Object { if (-not $_) { throw 'Direct2D renderer missing' } }
          Select-String -Path PhoneBridge/windows/native/Receiver.cpp -Pattern 'DXGI_FORMAT_B8G8R8A8_UNORM' -Quiet | ForEach-Object { if (-not $_) { throw 'Explicit Direct2D BGRA8 format missing' } }
          Select-String -Path PhoneBridge/windows/native/Receiver.cpp -Pattern 'PhoneBridge-Decoded-Frame.bmp' -Quiet | ForEach-Object { if (-not $_) { throw 'Decoded frame diagnostic missing' } }
          if (Select-String -Path PhoneBridge/windows/native/Receiver.cpp -Pattern 'StretchDIBits\(' -Quiet) { throw 'Legacy GDI StretchDIBits renderer still present' }
      - name: Configure PhoneBridge
        shell: pwsh
        run: |
          $prefix = Join-Path $PWD 'libjpeg-install'
          cmake -S PhoneBridge/windows/native -B PhoneBridge/windows/build -A x64 "-DCMAKE_PREFIX_PATH=$prefix"
      - name: Build PhoneBridge
        shell: pwsh
        run: cmake --build PhoneBridge/windows/build --config Release
      - name: Verify JPEG RGB channels
        shell: pwsh
        run: PhoneBridge/windows/build/Release/PhoneBridgeDecoderSelfTest.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Windows-Direct2D-TurboJPEG-Receiver
          path: PhoneBridge/windows/build/Release/PhoneBridgeReceiver.exe
          if-no-files-found: error
