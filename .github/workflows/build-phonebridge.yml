name: Build PhoneBridge

on:
  push:
    branches: [phonebridge-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild PhoneBridge source archive
        run: |
          cat phonebridge-source/p1-0.b64 phonebridge-source/p1-1.b64 phonebridge-source/p1-2.b64 phonebridge-source/p1-3.b64 phonebridge-source/part2.b64 phonebridge-source/p3-0.b64 phonebridge-source/p3-1.b64 phonebridge-source/p3-2.b64 phonebridge-source/p3-3.b64 phonebridge-source/part4.b64 | base64 -d > PhoneBridge-source.rebuilt.zip
          unzip -t PhoneBridge-source.rebuilt.zip
          unzip -q PhoneBridge-source.rebuilt.zip
      - name: Apply camera lifecycle and A/V quality patches
        run: |
          cp phonebridge-patches/StreamService.java PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          cp phonebridge-patches/YuvTools.java PhoneBridge/android/app/src/main/java/com/phonebridge/app/YuvTools.java
          python phonebridge-patches/fix_camera_main_thread.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          python phonebridge-patches/fix_av_quality.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          python phonebridge-patches/fix_color_rotation_v2.py PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'ContextCompat.getMainExecutor(this)' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'OUTPUT_IMAGE_FORMAT_RGBA_8888' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'image.toBitmap()' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'OrientationEventListener' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'UseCase.snapToSurfaceRotation' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          grep -q 'NoiseSuppressor.isAvailable()' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java
          if grep -q 'future.addListener.*cameraExecutor' PhoneBridge/android/app/src/main/java/com/phonebridge/app/StreamService.java; then
            echo 'CameraX lifecycle is still using background executor' >&2
            exit 1
          fi
      - name: Pin stable Android API
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' PhoneBridge/android/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' PhoneBridge/android/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build APK
        run: gradle -p PhoneBridge/android --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Android-Control-APK
          path: PhoneBridge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows Control Receiver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild PhoneBridge source archive
        shell: pwsh
        run: |
          $names = 'p1-0','p1-1','p1-2','p1-3','part2','p3-0','p3-1','p3-2','p3-3','part4'
          $b64 = ($names | ForEach-Object { Get-Content "phonebridge-source/$_.b64" -Raw }) -join ''
          [IO.File]::WriteAllBytes('PhoneBridge-source.rebuilt.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path PhoneBridge-source.rebuilt.zip -DestinationPath . -Force
      - name: Apply control, color-decode and cross-session bus patches
        shell: pwsh
        run: |
          Copy-Item phonebridge-patches/Receiver.cpp PhoneBridge/windows/native/Receiver.cpp -Force
          Copy-Item phonebridge-patches/JpegDecoder.cpp PhoneBridge/windows/native/JpegDecoder.cpp -Force
          Copy-Item phonebridge-patches/CMakeLists.txt PhoneBridge/windows/native/CMakeLists.txt -Force
          Copy-Item phonebridge-patches/SharedBus.cpp PhoneBridge/windows/native/SharedBus.cpp -Force
          Copy-Item phonebridge-patches/SharedBus.h PhoneBridge/windows/native/SharedBus.h -Force
          Select-String -Path PhoneBridge/windows/native/JpegDecoder.cpp -Pattern 'GUID_WICPixelFormat24bppBGR' -Quiet | ForEach-Object { if (-not $_) { throw '24bpp BGR decoder patch missing' } }
          Select-String -Path PhoneBridge/windows/native/JpegDecoder.cpp -Pattern 'dst\[x \* 4 \+ 3\] = 255' -Quiet | ForEach-Object { if (-not $_) { throw 'Explicit BGRA expansion missing' } }
      - name: Configure
        shell: pwsh
        run: cmake -S PhoneBridge/windows/native -B PhoneBridge/windows/build -A x64
      - name: Build
        shell: pwsh
        run: cmake --build PhoneBridge/windows/build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Windows-Control-Receiver
          path: PhoneBridge/windows/build/Release/PhoneBridgeReceiver.exe
          if-no-files-found: error
