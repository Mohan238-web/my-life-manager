name: Build PhoneBridge v1.1 RC

on:
  push:
    branches: [phonebridge-build]
    paths:
      - '.github/workflows/build-phonebridge-v1.1-rc.yml'
      - 'phonebridge-v11/**'
      - 'phonebridge-release/**'
      - 'phonebridge-installer/PhoneBridge-v11.iss'
      - 'phonebridge-installer/patch_vcam_silent.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  windows_release_candidate:
    name: Windows v1.1 hardened package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild PhoneBridge source and v1 patches
        shell: pwsh
        run: |
          $names = 'p1-0','p1-1','p1-2','p1-3','part2','p3-0','p3-1','p3-2','p3-3','part4'
          $b64 = ($names | ForEach-Object { Get-Content "phonebridge-source/$_.b64" -Raw }) -join ''
          [IO.File]::WriteAllBytes('PhoneBridge-source.rebuilt.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path PhoneBridge-source.rebuilt.zip -DestinationPath . -Force

          $v1Names = 'v1patch-00','v1patch-01','v1patch-02'
          $v1b64 = ($v1Names | ForEach-Object { Get-Content "phonebridge-v1/$_.b64" -Raw }) -join ''
          [IO.File]::WriteAllBytes('PhoneBridge-v1-patches.zip', [Convert]::FromBase64String($v1b64))
          Expand-Archive -Path PhoneBridge-v1-patches.zip -DestinationPath PhoneBridge-v1-patches -Force

      - name: Build static libjpeg-turbo 3.2.0
        shell: pwsh
        run: |
          git clone --branch 3.2.0 --depth 1 https://github.com/libjpeg-turbo/libjpeg-turbo.git libjpeg-turbo
          $prefix = Join-Path $PWD 'libjpeg-install'
          cmake -S libjpeg-turbo -B libjpeg-build -A x64 -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_TURBOJPEG=ON -DWITH_TOOLS=OFF -DWITH_TESTS=OFF -DWITH_SIMD=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_INSTALL_PREFIX=$prefix"
          cmake --build libjpeg-build --config Release --target install

      - name: Apply proven v1 media path and v1.1 hardening
        shell: pwsh
        run: |
          Copy-Item phonebridge-patches/Receiver.cpp PhoneBridge/windows/native/Receiver.cpp -Force
          Copy-Item phonebridge-patches/JpegDecoder.cpp PhoneBridge/windows/native/JpegDecoder.cpp -Force
          Copy-Item phonebridge-patches/JpegDecoder.h PhoneBridge/windows/native/JpegDecoder.h -Force
          Copy-Item phonebridge-patches/DecoderSelfTest.cpp PhoneBridge/windows/native/DecoderSelfTest.cpp -Force
          Copy-Item phonebridge-patches/CMakeLists.txt PhoneBridge/windows/native/CMakeLists.txt -Force
          Copy-Item phonebridge-patches/SharedBus.cpp PhoneBridge/windows/native/SharedBus.cpp -Force
          Copy-Item phonebridge-patches/SharedBus.h PhoneBridge/windows/native/SharedBus.h -Force

          python phonebridge-patches/add_raw_jpeg_diagnostic.py PhoneBridge/windows/native/Receiver.cpp
          python phonebridge-patches/fix_preview_direct2d.py PhoneBridge/windows/native/Receiver.cpp
          python PhoneBridge-v1-patches/upgrade_v1_windows.py PhoneBridge/windows/native/Receiver.cpp
          python phonebridge-v11/harden_windows.py PhoneBridge/windows/native/Receiver.cpp

          $cmake = Get-Content PhoneBridge/windows/native/CMakeLists.txt -Raw
          $cmake = $cmake.Replace(
            'target_link_libraries(PhoneBridgeReceiver PRIVATE ws2_32 ole32 shlwapi comctl32 libjpeg-turbo::turbojpeg-static)',
            'target_link_libraries(PhoneBridgeReceiver PRIVATE ws2_32 ole32 shlwapi comctl32 shell32 mfplat mfreadwrite mfuuid libjpeg-turbo::turbojpeg-static)'
          )
          Set-Content PhoneBridge/windows/native/CMakeLists.txt $cmake

          $src = Get-Content PhoneBridge/windows/native/Receiver.cpp -Raw
          foreach($marker in @('D2D1CreateFactory','DXGI_FORMAT_B8G8R8A8_UNORM','phoneBridgeLogDir','PhoneBridge-v1.1-SingleInstance','MFCreateSinkWriterFromURL','loadOrCreatePin')) {
            if(-not $src.Contains($marker)){ throw "v1.1 required marker missing: $marker" }
          }
          if($src.Contains('StretchDIBits(')){ throw 'Regression: legacy color-corrupting renderer returned' }

      - name: Configure and build v1.1 receiver
        shell: pwsh
        run: |
          $prefix = Join-Path $PWD 'libjpeg-install'
          cmake -S PhoneBridge/windows/native -B PhoneBridge/windows/build-v11 -A x64 "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build PhoneBridge/windows/build-v11 --config Release

      - name: Verify JPEG RGB regression test
        shell: pwsh
        run: PhoneBridge/windows/build-v11/Release/PhoneBridgeDecoderSelfTest.exe

      - name: Download validated Android v1 APK
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Mohan238-web/my-life-manager
          run-id: 31598116099
          name: PhoneBridge-Android-v1-APK
          path: validated/android

      - name: Download validated virtual camera package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Mohan238-web/my-life-manager
          run-id: 31573415584
          name: PhoneBridge-Windows-Virtual-Camera
          path: validated/vcam

      - name: Build silent virtual-camera setup wrapper
        shell: pwsh
        run: |
          python phonebridge-installer/patch_vcam_silent.py phonebridge-vcam/PhoneBridgeVirtualCameraSetup.cpp
          cmake -S phonebridge-vcam -B phonebridge-vcam/v11-build -A x64
          cmake --build phonebridge-vcam/v11-build --config Release --target PhoneBridgeVirtualCameraSetup
          if (-not (Test-Path phonebridge-vcam/v11-build/Release/PhoneBridgeVirtualCameraSetup.exe)) { throw 'Camera setup wrapper not produced' }

      - name: Prepare v1.1 payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force phonebridge-installer/payload-v11 | Out-Null
          $apk = Get-ChildItem validated/android -Recurse -Filter '*.apk' | Select-Object -First 1
          $dll = Get-ChildItem validated/vcam -Recurse -Filter 'VirtualCameraMediaSource.dll' | Select-Object -First 1
          if (-not $apk -or -not $dll) { throw 'Validated Android/camera payload incomplete' }
          Copy-Item PhoneBridge/windows/build-v11/Release/PhoneBridgeReceiver.exe phonebridge-installer/payload-v11/PhoneBridge.exe
          Copy-Item $apk.FullName phonebridge-installer/payload-v11/PhoneBridge-v1.apk
          Copy-Item $dll.FullName phonebridge-installer/payload-v11/VirtualCameraMediaSource.dll
          Copy-Item phonebridge-vcam/v11-build/Release/PhoneBridgeVirtualCameraSetup.exe phonebridge-installer/payload-v11/PhoneBridgeVirtualCameraSetup.exe
          @'
          PhoneBridge v1.1 RC1

          Real-device validated media baseline preserved:
          CameraX NV21 -> JPEG -> libjpeg-turbo BGRA -> Direct2D -> PhoneBridge Camera.

          v1.1 hardening:
          - single-instance Windows receiver (prevents duplicate port-8989 conflicts)
          - local diagnostic/crash log at %LOCALAPPDATA%\PhoneBridge\Logs\PhoneBridge.log
          - 2 MB log rotation to PhoneBridge.previous.log
          - release checksum manifest
          - signing-ready Windows release pipeline

          Existing v1 features remain: remembered pairing, auto reconnect, quality/FPS controls,
          snapshots, MP4 recording, virtual camera, firewall setup and optional Start with Windows.

          Signing status is recorded in SIGNING-STATUS.txt. Trusted publisher warnings only disappear
          when a real Authenticode certificate is supplied to the release workflow.
          '@ | Set-Content phonebridge-installer/payload-v11/README.txt

          $files = Get-ChildItem phonebridge-installer/payload-v11 -File | Where-Object Name -ne 'CHECKSUMS-SHA256.txt'
          $lines = foreach($f in $files){ $h=(Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($f.Name)" }
          $lines | Set-Content phonebridge-installer/payload-v11/CHECKSUMS-SHA256.txt

      - name: Sign Windows payload when trusted certificate secrets are configured
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $status='UNSIGNED - trusted Windows signing certificate secrets are not configured.'
          if($env:PFX_B64){
            $pfx=Join-Path $env:RUNNER_TEMP 'phonebridge-release.pfx'
            [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:PFX_B64))
            $signtool=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -Match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
            if(-not $signtool){ throw 'signtool.exe not found' }
            foreach($file in @('PhoneBridge.exe','PhoneBridgeVirtualCameraSetup.exe','VirtualCameraMediaSource.dll')){
              $path="phonebridge-installer/payload-v11/$file"
              & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $path
              if($LASTEXITCODE -ne 0){ throw "Authenticode signing failed: $file" }
              & $signtool.FullName verify /pa /v $path
              if($LASTEXITCODE -ne 0){ throw "Authenticode verification failed: $file" }
            }
            Remove-Item $pfx -Force
            $status='SIGNED - Authenticode signature applied and verified in CI.'
          }
          $status | Set-Content phonebridge-installer/payload-v11/SIGNING-STATUS.txt

      - name: Refresh payload checksum manifest after optional signing
        shell: pwsh
        run: |
          $files = Get-ChildItem phonebridge-installer/payload-v11 -File | Where-Object Name -ne 'CHECKSUMS-SHA256.txt'
          $lines = foreach($f in $files){ $h=(Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($f.Name)" }
          $lines | Set-Content phonebridge-installer/payload-v11/CHECKSUMS-SHA256.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build v1.1 RC installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $cmd=Get-Command ISCC.exe -ErrorAction SilentlyContinue; if($cmd){$iscc=$cmd.Source} }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc phonebridge-installer/PhoneBridge-v11.iss
          if ($LASTEXITCODE -ne 0) { throw 'v1.1 installer build failed' }

      - name: Sign final installer when trusted certificate secrets are configured
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $setup='phonebridge-installer/out-v11/PhoneBridge-v1.1-RC1-Setup.exe'
          if($env:PFX_B64){
            $pfx=Join-Path $env:RUNNER_TEMP 'phonebridge-installer.pfx'
            [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:PFX_B64))
            $signtool=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -Match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup
            if($LASTEXITCODE -ne 0){ throw 'Installer Authenticode signing failed' }
            & $signtool.FullName verify /pa /v $setup
            if($LASTEXITCODE -ne 0){ throw 'Installer Authenticode verification failed' }
            Remove-Item $pfx -Force
          }
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $apk=Get-ChildItem phonebridge-installer/payload-v11 -Filter '*.apk' | Select-Object -First 1
          $apkHash=(Get-FileHash $apk.FullName -Algorithm SHA256).Hash.ToLower()
          @("$hash  PhoneBridge-v1.1-RC1-Setup.exe","$apkHash  $($apk.Name)") | Set-Content phonebridge-installer/out-v11/RELEASE-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-v1.1-RC1
          path: |
            phonebridge-installer/out-v11/PhoneBridge-v1.1-RC1-Setup.exe
            phonebridge-installer/out-v11/RELEASE-SHA256.txt
            phonebridge-installer/payload-v11/PhoneBridge-v1.apk
            phonebridge-installer/payload-v11/SIGNING-STATUS.txt
            phonebridge-installer/payload-v11/README.txt
          if-no-files-found: error
