name: Build PhoneBridge v1.6.2 Camera Hotfix

on:
  push:
    branches: [phonebridge-build]
    paths:
      - '.github/workflows/build-phonebridge-v1.6.2-camera-hotfix.yml'
      - 'phonebridge-v16/patch_vcam_stable720_v161.py'
      - 'phonebridge-v16/patch_vcam_fit_lowlatency.py'
      - 'phonebridge-v16/patch_vcam_readonly_sequence_v162.py'
      - 'phonebridge-v16/patch_probe_verbose_v162.py'
      - 'phonebridge-vcam/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows v1.6.2 Frame Server crash hotfix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Microsoft virtual camera sample and apply v1.6.2 stable path
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/Windows-Camera.git windows-camera
          nuget restore windows-camera/Samples/VirtualCamera/VirtualCameraSample.sln -PackagesDirectory windows-camera/Samples/VirtualCamera/packages -NonInteractive
          $frame='windows-camera/Samples/VirtualCamera/VirtualCameraMediaSource/SimpleFrameGenerator.cpp'
          $stream='windows-camera/Samples/VirtualCamera/VirtualCameraMediaSource/SimpleMediaStream.cpp'
          python phonebridge-vcam/patch_vcam.py $frame
          python phonebridge-v16/patch_vcam_fit_lowlatency.py $frame
          python phonebridge-v16/patch_vcam_readonly_sequence_v162.py $frame
          python phonebridge-v16/patch_vcam_stable720_v161.py $stream
          python phonebridge-vcam/test_color_math.py

          foreach($marker in @('PhoneBridgeFitLatestFrame v1.6','PhoneBridgeReadOnlySequence v1.6.2','FIT_CENTER instead of stretch/crop','s_cached.swap(s_candidate)')){
            if(-not (Select-String -Path $frame -Pattern ([regex]::Escape($marker)) -Quiet)){throw "v1.6.2 frame marker missing: $marker"}
          }
          if(Select-String -Path $frame -Pattern 'InterlockedCompareExchange\(' -Quiet){throw 'Regression: write-style interlocked read remains in read-only mapping'}
          foreach($marker in @('PhoneBridgeStable720 v1.6.1','#define NUM_IMAGE_ROWS 720','#define NUM_IMAGE_COLS 1280')){
            if(-not (Select-String -Path $stream -Pattern ([regex]::Escape($marker)) -Quiet)){throw "stable 720 marker missing: $marker"}
          }
          if(Select-String -Path $stream -Pattern 'PhoneBridgeAdaptiveMedia v1.6|NUM_MEDIATYPES = 4' -Quiet){throw 'Regression: adaptive multi-format media negotiation returned'}

      - name: Build v1.6.2 virtual camera media source
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if(-not $msbuild){throw 'MSBuild not found'}
          & $msbuild windows-camera/Samples/VirtualCamera/VirtualCameraMediaSource/VirtualCameraMediaSource.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$PWD\windows-camera\Samples\VirtualCamera\" /verbosity:minimal
          $dll=Get-ChildItem windows-camera -Recurse -Filter VirtualCameraMediaSource.dll | Select-Object -First 1
          if(-not $dll){throw 'VirtualCameraMediaSource.dll not produced'}
          "VCAM_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build repair setup and verbose camera health probe
        shell: pwsh
        run: |
          python phonebridge-installer/patch_vcam_silent.py phonebridge-vcam/PhoneBridgeVirtualCameraSetup.cpp
          python phonebridge-v14/patch_vcam_v14.py phonebridge-vcam/PhoneBridgeVirtualCameraSetup.cpp
          Copy-Item phonebridge-v14/PhoneBridgeCameraProbe.cpp phonebridge-vcam/PhoneBridgeCameraProbe.cpp -Force
          python phonebridge-v16/patch_probe_verbose_v162.py phonebridge-vcam/PhoneBridgeCameraProbe.cpp
          $cmake=Get-Content phonebridge-vcam/CMakeLists.txt -Raw
          $cmake += @'

          add_executable(PhoneBridgeCameraProbe WIN32 PhoneBridgeCameraProbe.cpp)
          target_compile_definitions(PhoneBridgeCameraProbe PRIVATE UNICODE _UNICODE WIN32_LEAN_AND_MEAN NOMINMAX)
          target_link_libraries(PhoneBridgeCameraProbe PRIVATE ole32 mf mfplat mfreadwrite mfuuid shell32)
          '@
          Set-Content phonebridge-vcam/CMakeLists.txt $cmake
          cmake -S phonebridge-vcam -B phonebridge-vcam/v162-build -A x64
          cmake --build phonebridge-vcam/v162-build --config Release --target PhoneBridgeVirtualCameraSetup PhoneBridgeComProbe PhoneBridgeCameraProbe
          & phonebridge-vcam/v162-build/Release/PhoneBridgeComProbe.exe $env:VCAM_DLL
          if($LASTEXITCODE -ne 0){throw 'PhoneBridge v1.6.2 COM class-factory probe failed'}

      - name: Package v1.6.2 hotfix
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force phonebridge-v16/hotfix162 | Out-Null
          Copy-Item $env:VCAM_DLL phonebridge-v16/hotfix162/VirtualCameraMediaSource.dll
          Copy-Item phonebridge-vcam/v162-build/Release/PhoneBridgeVirtualCameraSetup.exe phonebridge-v16/hotfix162/PhoneBridgeVirtualCameraSetup.exe
          Copy-Item phonebridge-vcam/v162-build/Release/PhoneBridgeCameraProbe.exe phonebridge-v16/hotfix162/PhoneBridgeCameraProbe.exe
          @'
          PhoneBridge v1.6.2 Camera Hotfix

          Root-cause fix:
          - v1.6/v1.6.1 mapped video.bus read-only in Windows Camera Frame Server but used InterlockedCompareExchange to read the sequence counter.
          - InterlockedCompareExchange is a read-modify-write operation and can fault on a read-only mapping, terminating Frame Server and surfacing as RPC failure / camera busy or blocked.
          - v1.6.2 uses true read-only sequence loads.

          Preserved:
          - stable 1280x720 @ 30 FPS virtual-camera media type
          - FIT_CENTER portrait handling without wide faces
          - last-good-frame cache to avoid black flicker
          - low-latency persistent mapping
          - Android v1.6 matched preview framing/background streaming
          - PhoneBridge v1.5 audio / VB-CABLE unchanged

          Install:
          1. Close all browsers, Camera, Zoom, Teams and OBS.
          2. Keep PhoneBridgeVirtualCameraSetup.exe and VirtualCameraMediaSource.dll together.
          3. Run PhoneBridgeVirtualCameraSetup.exe as Administrator.
          4. Restart Windows once.
          5. Connect PhoneBridge, then run PhoneBridgeCameraProbe.exe before opening a browser.
          6. The probe now shows the exact HRESULT directly if anything still fails.
          '@ | Set-Content phonebridge-v16/hotfix162/README-v1.6.2.txt
          $files=Get-ChildItem phonebridge-v16/hotfix162 -File
          ($files | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" }) | Set-Content phonebridge-v16/hotfix162/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-v1.6.2-Camera-Hotfix
          path: phonebridge-v16/hotfix162/*
          if-no-files-found: error
