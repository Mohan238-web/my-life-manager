name: PhoneBridge v2.2 Tile Plugin Build

on:
  push:
    branches: [phonebridge-v2-build]
    paths:
      - 'phonebridge-v2.2-plugin/**'
      - '.github/workflows/phonebridge-v2.2-plugin-build.yml'
  workflow_dispatch:

jobs:
  android-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build plugin
        working-directory: phonebridge-v2.2-plugin
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-v2.2-Tile-Plugin
          path: phonebridge-v2.2-plugin/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
