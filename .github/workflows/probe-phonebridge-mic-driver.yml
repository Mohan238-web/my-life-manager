name: Probe PhoneBridge Windows Microphone Driver

on:
  push:
    branches: [phonebridge-build]
    paths:
      - '.github/workflows/probe-phonebridge-mic-driver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone Microsoft Windows driver samples
        shell: pwsh
        run: git clone --depth 1 https://github.com/microsoft/Windows-driver-samples.git MicrosoftDriverSamples

      - name: Inject current WDK NuGet package into official sample
        shell: pwsh
        run: |
          $props = @'
          <Project>
            <ItemGroup>
              <PackageReference Include="Microsoft.Windows.WDK.x64" Version="10.0.28000.2526" />
            </ItemGroup>
          </Project>
          '@
          $props | Set-Content MicrosoftDriverSamples/audio/simpleaudiosample/Directory.Build.props

      - name: Restore and build official Simple Audio Sample x64
        shell: pwsh
        run: |
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild=& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if(-not $msbuild){ throw 'MSBuild not found' }
          & $msbuild MicrosoftDriverSamples/audio/simpleaudiosample/SimpleAudioSample.sln /m /t:Restore /p:Configuration=Release /p:Platform=x64 /p:RestorePackagesConfig=true /v:minimal
          if($LASTEXITCODE -ne 0){ throw 'WDK NuGet restore failed' }
          & $msbuild MicrosoftDriverSamples/audio/simpleaudiosample/SimpleAudioSample.sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal
          if($LASTEXITCODE -ne 0){ throw 'SimpleAudioSample build failed after WDK NuGet restore' }

      - name: Show driver outputs
        shell: pwsh
        run: |
          Get-ChildItem MicrosoftDriverSamples/audio/simpleaudiosample -Recurse -Include *.sys,*.inf,*.cat,*.cer | Select-Object FullName,Length

      - uses: actions/upload-artifact@v4
        with:
          name: Microsoft-SimpleAudioSample-WDK-NuGet-Probe
          path: |
            MicrosoftDriverSamples/audio/simpleaudiosample/**/package/**
            MicrosoftDriverSamples/audio/simpleaudiosample/**/*.sys
            MicrosoftDriverSamples/audio/simpleaudiosample/**/*.inf
            MicrosoftDriverSamples/audio/simpleaudiosample/**/*.cat
            MicrosoftDriverSamples/audio/simpleaudiosample/**/*.cer
          if-no-files-found: warn
