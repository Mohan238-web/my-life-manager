name: Export Android Build Tools
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-android-tools.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android tools bundle
        run: |
          set -e
          SDK="$ANDROID_HOME"
          BT=$(ls -1 "$SDK/build-tools" | sort -V | tail -1)
          mkdir -p android-tools/build-tools android-tools/platform
          cp -a "$SDK/build-tools/$BT/." android-tools/build-tools/
          cp "$SDK/platforms/android-35/android.jar" android-tools/platform/android.jar
          echo "$BT" > android-tools/BUILD_TOOLS_VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Tools-35
          path: android-tools
          retention-days: 1
