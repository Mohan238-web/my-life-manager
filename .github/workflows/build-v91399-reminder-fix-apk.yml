name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-v9.13.99-reminder-fix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare launcher icons
        run: |
          base64 --decode launcher-icon.png.b64 > launcher-icon.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$density
            cp launcher-icon.png app/src/main/res/mipmap-$density/ic_launcher.png
            cp launcher-icon.png app/src/main/res/mipmap-$density/ic_launcher_round.png
          done
      - name: Restore approved HTML asset
        run: |
          mkdir -p app/src/main/assets
          cat app/src/main/assets_parts/index.html.gz.b64.part-* | base64 --decode | gzip --decompress > app/src/main/assets/index.html
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk My-Life-Manager-v9.13.99.apk
      - uses: actions/upload-artifact@v4
        with:
          name: My-Life-Manager-v9.13.99-APK
          path: android-v9.13.99-reminder-fix/My-Life-Manager-v9.13.99.apk
          if-no-files-found: error
