<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>My Personal Workspace</title>
    <style>
      :root {
        --bg: #0b1220;
        --line: #23314b;
        --text: #eef4ff;
        --muted: #9cabbe;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      #frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      #matrix {
        position: fixed;
        z-index: 50;
        top: calc(10px + env(safe-area-inset-top));
        left: 10px;
        width: 36px;
        height: 36px;
        display: grid;
        grid-template-columns: repeat(3, 5px);
        grid-template-rows: repeat(3, 5px);
        place-content: center;
        gap: 4px;
        border: 1px solid #2c3b57;
        border-radius: 10px;
        background: #111c30;
        cursor: pointer;
        box-shadow: none;
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }
      #matrix span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #68a9ff;
        box-shadow: 0 0 5px #68a9ff88;
      }
      #matrix:hover,
      #matrix:focus-visible {
        border-color: #68a9ff;
        background: #172946;
      }
      #matrix:active {
        transform: scale(0.96);
      }
      #nav {
        position: fixed;
        z-index: 40;
        inset: 0 auto 0 0;
        width: min(290px, 86vw);
        padding: calc(20px + env(safe-area-inset-top)) 14px 20px;
        transform: translateX(-105%);
        transition: transform 0.2s ease;
        background: linear-gradient(180deg, #0c1424, #08101d);
        border-right: 1px solid var(--line);
        box-shadow: 16px 0 42px #0009;
        color: var(--text);
      }
      body.open #nav {
        transform: translateX(0);
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 4px 20px;
      }
      .title {
        font-size: 18px;
        font-weight: 800;
      }
      .close {
        width: 36px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #111c30;
        color: var(--text);
        font-size: 20px;
        cursor: pointer;
      }
      .items {
        display: grid;
        gap: 9px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 13px 14px;
        border: 1px solid transparent;
        border-radius: 13px;
        background: transparent;
        color: var(--text);
        font: 600 15px/1.2 inherit;
        text-align: left;
        cursor: pointer;
      }
      .item:hover {
        background: #111c30;
        border-color: var(--line);
      }
      .item.active {
        background: #172946;
        border-color: #315486;
      }
      .num {
        display: grid;
        place-items: center;
        flex: 0 0 28px;
        height: 28px;
        border-radius: 9px;
        background: #20324d;
        color: #bcd5ff;
      }
      .hint {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 20px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      #shade {
        position: fixed;
        z-index: 35;
        inset: 0;
        background: #0007;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      body.open #shade {
        opacity: 1;
        pointer-events: auto;
      }
      #loading {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: grid;
        place-items: center;
        background: #07101d;
        color: #dce9ff;
        font: 600 14px system-ui;
      }
      #loading.hide {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #nav,
        #shade {
          transition: none;
        }
      }
    </style>
  </head>

        },
      ];
      const frame = document.querySelector("#frame"),
        items = document.querySelector(".items"),
        matrix = document.querySelector("#matrix"),
        loading = document.querySelector("#loading");
      let active = -1;
      const setOpen = (v) => {
        document.body.classList.toggle("open", v);
        matrix.setAttribute("aria-expanded", String(v));
      };
      async function unpack(data) {
        const bytes = Uint8Array.from(atob(data), (c) => c.charCodeAt(0));
        const stream = new Blob([bytes])
          .stream()
          .pipeThrough(new DecompressionStream("gzip"));
        return await new Response(stream).text();
      }
      async function openPage(index) {
        if (index === active) {
          setOpen(false);
          return;
        }
        active = index;
        const page = pages[index];
        loading.textContent = "Opening " + page.name + "…";
        loading.classList.remove("hide");
        frame.title = page.name;
        frame.srcdoc = await unpack(page.data);
        [...items.children].forEach((b, i) =>
          b.classList.toggle("active", i === index),
        );
        setOpen(false);
      }
      pages.forEach((p, i) => {
        const b = document.createElement("button");
        b.className = "item";
        b.type = "button";
        b.innerHTML =
          '<span class="num">' + p.icon + "</span><span>" + p.name + "</span>";
        b.onclick = () => openPage(i);
        items.append(b);
      });
      frame.addEventListener("load", () => loading.classList.add("hide"));
      matrix.onclick = () => setOpen(!document.body.classList.contains("open"));
      document.querySelector(".close").onclick = () => setOpen(false);
      document.querySelector("#shade").onclick = () => setOpen(false);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") setOpen(false);
      });
      openPage(0);
    </script>
  </body>
